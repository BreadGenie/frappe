name: Ticket 08 cache qualification
on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Qualification phase
        type: choice
        options: [early, warm, fallback, recreated]
        default: early
permissions:
  contents: read
jobs:
  cache:
    name: Cache qualification ${{ inputs.purpose }}
    runs-on: runway-cache-blr-development-20261026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: frappe-src
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frappe-src/yarn.lock
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/requirements*.txt
      - name: Verify tools and hold for isolated lifecycle probes
        run: |
          node --version
          yarn --version
          uv --version
          sleep 300
