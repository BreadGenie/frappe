name: Runway Startup Experiment
on:
  push:
    branches: [runway-startup-latency-20261010]
permissions:
  contents: read
jobs:
  startup:
    runs-on: runway-startup-experiment-5g
    timeout-minutes: 5
    steps:
      - name: First job command
        run: |
          python3 -c 'from datetime import datetime, UTC; print("RUNWAY_FIRST_COMMAND", datetime.now(UTC).isoformat())'
          test -x /home/runner/actions-runner/bin/Runner.Listener
          docker info >/dev/null
          cat /proc/uptime
          systemctl show ssh.service docker.service systemd-networkd.service apply-metadata.service --property=Id --property=ExecMainStartTimestampMonotonic --property=ActiveEnterTimestampMonotonic --property=InactiveExitTimestampMonotonic
          systemd-analyze critical-chain docker.service ssh.service
