name: 'Setup Environment'
description: 'Sets up the environment for Frappe development'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.14'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  build-assets:
    required: false
    description: 'Whether to build assets'
    default: true
  enable-coverage:
    required: false
    default: false
  disable-web:
    required: false
    default: false
  disable-socketio:
    required: false
    default: false
  db:
    required: false
    default: mariadb
  db-root-password:
    required: true

runs:
  using: "composite"
  steps:
  - shell: bash -e {0}
    run: |
      # Add 'test_site' to /etc/hosts & setup git config
      echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts
      git config --global init.defaultBranch main
      git config --global advice.detachedHead false

  # A baked virtualenv is usable only at its original path and source/toolchain pins.
  - id: bake
    shell: bash -e {0}
    env:
      REQUESTED_PYTHON: ${{ inputs.python-version }}
      REQUESTED_NODE: ${{ inputs.node-version }}
      WANTED_BENCH_ROOT: ${{ github.workspace }}
    run: |
      manifest=/etc/runway-frappe-bench.json
      if [[ -f $manifest && ! -r $manifest ]]; then sudo chmod 0644 "$manifest"; fi
      declared="$GITHUB_WORKSPACE/.github/frappe-source.json"
      reason=

      echo "bake check: workspace=${GITHUB_WORKSPACE:-unset} pwd=$PWD"
      echo "bake check: manifest=$manifest $([ -f $manifest ] && echo present || echo absent)"
      echo "bake check: declared=$declared $([ -f $declared ] && echo present || echo absent)"

      if [[ ! -f $manifest ]]; then
        reason="this image carries no baked bench"
      elif [[ ! -f $declared ]]; then
        reason="the workflow declares no Frappe source to match the bake against"
      else
        reason=$(python3 - "$manifest" "$declared" "$REQUESTED_PYTHON" "$REQUESTED_NODE" <<'PY'
      import json, os, sys
      manifest_path, declared_path, want_python, want_node = sys.argv[1:5]
      try:
          manifest = json.load(open(manifest_path))
          declared = json.load(open(declared_path))
      except (OSError, ValueError) as error:
          print(f"a manifest could not be read: {error}")
          raise SystemExit(0)
      if manifest.get('bench_root') != os.environ.get('WANTED_BENCH_ROOT'):
          print(f"the image baked its bench at {manifest.get('bench_root')}, "
                f"this job's workspace is {os.environ.get('WANTED_BENCH_ROOT')}")
          raise SystemExit(0)
      for baked_key, declared_key in (('frappe_repository', 'repository'),
                                      ('frappe_commit', 'commit')):
          baked, want = manifest.get(baked_key), declared.get(declared_key)
          if baked != want:
              print(f"the image baked {baked or 'nothing'}, "
                    f"the workflow declares {want or 'nothing'}")
              raise SystemExit(0)
      for field, want, key in (('python', want_python, 'python_version'),
                               ('node', want_node, 'node_version')):
          version = manifest.get(key) or ''
          if version != want and not version.startswith(want + '.'):
              print(f"the image baked {field} {version}, the workflow asked for {want}")
              raise SystemExit(0)
      print('')
      PY
      )
        if [[ -z $reason ]]; then
          echo "usable=true" >> "$GITHUB_OUTPUT"
          echo "Using the bench baked into this image: $(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["frappe_commit"][:12])' "$manifest")"
        else
          echo "usable=false" >> "$GITHUB_OUTPUT"
          echo "Building a bench for this job because $reason."
        fi
      fi

  - name: Clone
    if: steps.bake.outputs.usable != 'true'
    uses: actions/checkout@v6
    with:
      path: frappe-src

  # Restore a cleared workspace only from the digest-verified image archive.
  - shell: bash -e {0}
    if: steps.bake.outputs.usable == 'true'
    run: |
      set -euo pipefail
      bench_root="$GITHUB_WORKSPACE"
      manifest=/etc/runway-frappe-bench.json
      if [ ! -x "$HOME/.local/bin/bench" ]; then
        echo "This image carries a bench but no bench executable at $HOME/.local/bin/bench." >&2
        exit 1
      fi
      echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      node_version=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["node_version"])' "$manifest")
      node_bin="/opt/hostedtoolcache/node/$node_version/x64/bin"
      test -x "$node_bin/node"
      echo "$node_bin" >> "$GITHUB_PATH"
      if [ -f "$bench_root/env/bin/python" ] && [ -d "$bench_root/apps/frappe" ]; then
        echo "The baked bench is already in the workspace; nothing to restore."
        exit 0
      fi
      echo "The workspace has no bench; restoring it from the image's archive."
      archive=$(python3 -c 'import json,sys;print(json.load(open("/etc/runway-frappe-bench.json"))["archive"]["path"])')
      expect=$(python3 -c 'import json,sys;print(json.load(open("/etc/runway-frappe-bench.json"))["archive"]["sha256"])')
      actual=$(sha256sum "$archive" | cut -d" " -f1)
      if [ "$actual" != "$expect" ]; then
        echo "The archive at $archive hashes to $actual, not the recorded $expect." >&2
        exit 1
      fi
      mkdir -p "$bench_root"
      tar -xzf "$archive" -C "$bench_root"
      for required in env/bin/python apps/frappe/frappe/__init__.py Procfile; do
        if [ ! -e "$bench_root/$required" ]; then
          echo "The archive did not contain $required." >&2
          exit 1
        fi
      done
      baked_root=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["bench_root"])' "$manifest")
      if [ "$bench_root" != "$baked_root" ]; then
        echo "This image baked its bench at $baked_root, but this job's workspace is $bench_root." >&2
        echo "The bench's virtualenv names the directory it was built in and cannot be moved." >&2
        echo 'Register the runner with that work folder, or build the image for this one.' >&2
        exit 1
      fi
      echo "Restored the bench from $archive."

  # The baked archive carries base-pin source, so the checked-out readiness
  # patch never reaches it. Apply the overlay to the restored copy only;
  # non-baked clones already contain it via checkout, so skip them here.
  - name: Apply RQ worker readiness overlay
    if: steps.bake.outputs.usable == 'true'
    shell: bash -e {0}
    run: |
      set -euo pipefail
      frappe_dir="$GITHUB_WORKSPACE/apps/frappe"
      target="$frappe_dir/frappe/commands/test_commands.py"
      patch="$GITHUB_WORKSPACE/.github/patches/rq-worker-readiness.patch"
      base_pin=$(python3 -c 'import json,os;print(json.load(open(os.environ["GITHUB_WORKSPACE"]+"/.github/frappe-source.json"))["commit"])')
      base_sha="f9dd25745240cf0c3f2ab3a8311b825a7c4878c812dcd1483f41f737ebbe7512"
      patch_sha="b1601285e302e051a82eb1e1a419c50806dc8f809fd15e6110fb0e2c55ff2c23"
      expect_sha="bbf144e45178b804d62b8e36840f1888645d26751b195a07cd0a22fde5cccf8c"
      actual_patch=$(sha256sum "$patch" | cut -d' ' -f1)
      current=$(sha256sum "$target" | cut -d' ' -f1)
      echo "readiness overlay: base_pin=$base_pin patch=$actual_patch file=$current"
      if [ "$actual_patch" != "$patch_sha" ]; then
        echo "The overlay patch does not match the approved bytes; refusing to apply." >&2
        exit 1
      fi
      if [ "$current" = "$expect_sha" ]; then
        echo "Readiness overlay already applied; nothing to do."
        exit 0
      fi
      if [ "$current" != "$base_sha" ]; then
        echo "The restored source is neither the base pin nor the patched file; refusing to apply." >&2
        exit 1
      fi
      git -C "$frappe_dir" apply --check "$patch"
      git -C "$frappe_dir" apply "$patch"
      current=$(sha256sum "$target" | cut -d' ' -f1)
      echo "Readiness overlay applied: file=$current"
      [ "$current" = "$expect_sha" ]

  - name: Setup Python
    uses: actions/setup-python@v6
    with:
      python-version: ${{ inputs.python-version }}

  - shell: bash -e {0}
    if: steps.bake.outputs.usable != 'true'
    run: |
      python -m compileall -q -f "${GITHUB_WORKSPACE}/frappe-src"
      if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}/frappe-src"
          then echo "Found merge conflicts"
          exit 1
      fi

  - uses: actions/setup-node@v6
    if: steps.bake.outputs.usable != 'true'
    with:
      node-version: ${{ inputs.node-version }}
      cache: yarn
      cache-dependency-path: frappe-src/yarn.lock

  - uses: astral-sh/setup-uv@v6
    if: steps.bake.outputs.usable != 'true'
    with:
      enable-cache: true
      cache-dependency-glob: |
        **/pyproject.toml
        **/requirements*.txt

  - name: Cache wkhtmltopdf
    if: steps.bake.outputs.usable != 'true'
    uses: actions/cache@v4
    with:
      path: /tmp/wkhtmltox.deb
      key: wkhtmltox-0.12.6.1-2-jammy-amd64

  - shell: bash -e {0}
    if: steps.bake.outputs.usable != 'true'
    run: |
      # Install System Dependencies (apt) in the background while installing the
      # frappe-bench tool via uv — the two share no inputs.
      start_time=$(date +%s)

      install_system_deps() {
        curl -LsS https://r.mariadb.com/downloads/mariadb_repo_setup | sudo bash -s -- --mariadb-server-version="mariadb-11.8.5" --skip-maxscale

        sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
        wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -

        sudo apt -qq update
        sudo apt -qq remove mysql-server mysql-client
        sudo apt -qq remove -y postgresql-client postgresql-client-16 postgresql-client-common
        sudo apt -qq install libcups2-dev redis-server mariadb-client libmariadb-dev postgresql-client-18 libpq-dev
        echo "/usr/lib/postgresql/18/bin" >> $GITHUB_PATH

        if [ ! -f /tmp/wkhtmltox.deb ]; then
          wget -q -O /tmp/wkhtmltox.deb https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
        fi
        sudo apt install /tmp/wkhtmltox.deb
      }

      install_system_deps &> ${GITHUB_WORKSPACE}/system_deps.log &
      sys_pid=$!

      # frappe-bench install via uv is independent of apt; do it while apt runs
      uv tool install frappe-bench

      if ! wait "$sys_pid"; then
        echo "System dependency install failed:"
        cat ${GITHUB_WORKSPACE}/system_deps.log
        exit 1
      fi
      cat ${GITHUB_WORKSPACE}/system_deps.log

      end_time=$(date +%s)
      echo -e "\033[33mInstall System Dependencies + bench tool: $((end_time - start_time)) seconds\033[0m"

  - shell: bash -e {0}
    if: steps.bake.outputs.usable != 'true'
    run: |
      # Init Bench
      start_time=$(date +%s)
      bench init ${GITHUB_WORKSPACE} \
        --ignore-exist \
        --frappe-path "${GITHUB_WORKSPACE}/frappe-src" \
        --skip-assets \
        --no-backups \
        --python "$(which python)"

      # bench init sets origin to the local checkout path, fix it to point at GitHub
      git -C apps/frappe remote set-url upstream "https://github.com/${{ github.repository }}"

      end_time=$(date +%s)
      echo -e "\033[33mInit Bench: $((end_time - start_time)) seconds\033[0m"

  - shell: bash -e {0}
    name: Trim Procfile
    run: |
      if [ ! -f Procfile ]; then
        echo "No Procfile at $PWD" >&2
        exit 1
      fi
      sed -i '/^watch:/d' Procfile
      sed -i '/^schedule:/d' Procfile
      if [ "${{ inputs.disable-web }}" == "true" ]; then
        sed -i '/^web:/d' Procfile
      elif [ "${{ inputs.enable-coverage }}" == "true" ]; then
        sed -i 's|^web: bench serve|web: bench serve --with-coverage|' Procfile
      fi
      if [ "${{ inputs.disable-socketio }}" == "true" ]; then
        sed -i '/^socketio:/d' Procfile
      fi

  - shell: bash -e {0}
    if: steps.bake.outputs.usable != 'true'
    run: |
      # Install dev/test dependencies (python and node deps are independent,
      # so install them concurrently)
      start_time=$(date +%s)

      bench setup requirements --dev &
      dev_pid=$!

      node_pid=""
      if [ "${{ inputs.build-assets }}" == "true" ]; then
        bench setup requirements --node &
        node_pid=$!
      fi

      wait "$dev_pid"
      if [ -n "$node_pid" ]; then
        wait "$node_pid"
      fi

      end_time=$(date +%s)
      echo -e "\033[33mInstall dev/test deps: $((end_time - start_time)) seconds\033[0m"

  - shell: bash -e {0}
    env:
      DB: ${{ inputs.db }}
      BUILD_ASSETS: ${{ inputs.build-assets }}
    run: |
      # Create Site (asset build is CPU-bound and independent of the DB, so
      # build it in the background while the site is being created)
      start_time=$(date +%s)

      build_pid=""
      if [ "$BUILD_ASSETS" == "true" ] && [ "${{ steps.bake.outputs.usable }}" != "true" ]; then
        CI=Yes bench build --force --production &> ${GITHUB_WORKSPACE}/build_assets.log &
        build_pid=$!
      fi

      if [ "$DB" == "postgres" ]; then
        DB_ROOT_USER="postgres"
        DB_ROOT_PWD="travis"
      else
        DB_ROOT_USER="root"
        DB_ROOT_PWD="${{ inputs.db-root-password }}"
      fi

      # Reduce durability for CI speed — the DB is ephemeral, so trading crash
      # safety for fewer fsyncs is free. innodb_flush_log_at_trx_commit=0 flushes
      # the redo log once per second instead of on every commit.
      if [ "$DB" == "mariadb" ]; then
        mariadb -h 127.0.0.1 -u "$DB_ROOT_USER" -p"$DB_ROOT_PWD" -e "
          SET GLOBAL innodb_flush_log_at_trx_commit = 0;
          SET GLOBAL sync_binlog = 0;"
      fi

      bench set-config -g root_login "$DB_ROOT_USER"
      bench set-config -g root_password "$DB_ROOT_PWD"
      bench set-config -g admin_password admin

      bench new-site test_site \
        --db-type "$DB" \
        --db-host 127.0.0.1 \
        --db-name test_frappe \
        --db-password test_frappe \
        --verbose
      bench --site test_site set-config allow_tests 1 --parse
      bench --site test_site set-config server_script_enabled 1 --parse
      bench --site test_site set-config host_name "http://test_site:8000"
      bench --site test_site set-config auto_email_id "test@example.com"
      bench --site test_site set-config mail_server localhost
      bench --site test_site set-config mail_port 2525 --parse
      bench --site test_site set-config mail_login "test@example.com"
      bench --site test_site set-config mail_password test
      bench --site test_site set-config disable_mail_smtp_authentication 1 --parse

      if [ "$DB" == "mariadb" ]; then
        bench --site test_site set-config monitor 1 --parse
        bench --site test_site set-config use_mysqlclient 1 --parse
      fi

      if [ -n "$build_pid" ]; then
        if ! wait "$build_pid"; then
          echo "Asset build failed:"
          cat ${GITHUB_WORKSPACE}/build_assets.log
          exit 1
        fi
        cat ${GITHUB_WORKSPACE}/build_assets.log
      fi

      end_time=$(date +%s)
      echo -e "\033[33mCreate Site + Build Assets: $((end_time - start_time)) seconds\033[0m"

  - shell: bash -e {0}
    run: |
      # Start Bench
      bench start &> ${GITHUB_WORKSPACE}/bench_start.log &
