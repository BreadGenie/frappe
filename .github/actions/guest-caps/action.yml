name: 'Guest Capabilities'
description: 'Measures what the runner guest is actually made of, for the Runway image investigation'

runs:
  using: "composite"
  steps:
  - name: Measure guest storage and network
    shell: bash -e {0}
    run: |
      set -uo pipefail
      echo "### cpu"
      echo "nproc=$(nproc)"
      grep -m1 'model name' /proc/cpuinfo || true
      echo "### memory"
      awk '/MemTotal|MemAvailable/ {printf "%s %.2f GiB\n", $1, $2/1048576}' /proc/meminfo
      echo "### workspace filesystem"
      df -hT "$GITHUB_WORKSPACE" | tail -1
      findmnt -no SOURCE,FSTYPE,OPTIONS --target "$GITHUB_WORKSPACE" || true

      echo "### sequential write, 512 MiB, fdatasync"
      sync
      t0=$(date +%s.%N)
      dd if=/dev/zero of="$GITHUB_WORKSPACE/.capstest" bs=1M count=512 conv=fdatasync 2>&1 | tail -1
      t1=$(date +%s.%N)
      echo "write_512MiB_s=$(echo "$t1 - $t0" | bc)"

      echo "### sequential read, 512 MiB, warm"
      t0=$(date +%s.%N)
      dd if="$GITHUB_WORKSPACE/.capstest" of=/dev/null bs=1M 2>&1 | tail -1
      t1=$(date +%s.%N)
      echo "read_512MiB_s=$(echo "$t1 - $t0" | bc)"
      rm -f "$GITHUB_WORKSPACE/.capstest"

      echo "### 2000 small files, node_modules shaped"
      rm -rf "$GITHUB_WORKSPACE/.capsmall"; mkdir -p "$GITHUB_WORKSPACE/.capsmall"
      t0=$(date +%s.%N)
      CAPS_DIR="$GITHUB_WORKSPACE/.capsmall" python3 - <<'PYEOF' || echo "small file probe failed, continuing"
      import os, pathlib
      d = pathlib.Path(os.environ["CAPS_DIR"])
      for i in range(2000):
          (d / f"f{i}").write_bytes(b"x" * 512)
      PYEOF
      t1=$(date +%s.%N)
      echo "small_2000_s=$(echo "$t1 - $t0" | bc)"
      rm -rf "$GITHUB_WORKSPACE/.capsmall"

      echo "### network to github release CDN, ~15 MiB artifact"
      t0=$(date +%s.%N)
      curl -sSL -o /dev/null -w 'http_code=%{http_code} bytes=%{size_download} seconds=%{time_total} bytes_per_s=%{speed_download}\n' \
        https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb || true
      t1=$(date +%s.%N)
      echo "wkhtmltox_dl_s=$(echo "$t1 - $t0" | bc)"

      echo "### network to nodejs.org, ~50 MiB artifact"
      curl -sSL -o /dev/null -w 'http_code=%{http_code} bytes=%{size_download} seconds=%{time_total} bytes_per_s=%{speed_download}\n' \
        https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz || true

      ### guest boot cost
      # The 27 s between Metal starting the VM and this runner starting is the largest
      # identified part of dispatch, so break it down rather than guess. Everything here is
      # read-only and must not be able to fail the job.
      systemd-analyze time 2>&1 | tail -2 || echo "systemd-analyze time unavailable"
      echo "-- slowest units by time --"
      systemd-analyze blame 2>/dev/null | head -15 || echo "blame unavailable"
      echo "-- critical chain --"
      systemd-analyze critical-chain 2>/dev/null | head -25 || echo "critical-chain unavailable"
      echo "-- enabled units, and how many are ones we would not miss --"
      systemctl list-units --type=service --state=running --no-legend --no-pager 2>/dev/null | wc -l
      systemctl list-unit-files --state=enabled --type=service --no-legend --no-pager 2>/dev/null | wc -l
      echo "-- kernel command line and serial console --"
      cat /proc/cmdline
      echo "-- time from kernel start to now, and to sshd --"
      awk 'NR==1 {print "kernel_start=" $1}' /proc/uptime 2>/dev/null || true
      systemctl show ssh.service -p ActiveEnterTimestampMonotonic -p ExecMainStartMonotonic --value 2>/dev/null || true
      echo "-- how long the images take to be found --"
      systemctl show docker.service -p ActiveEnterTimestampMonotonic --value 2>/dev/null || true
